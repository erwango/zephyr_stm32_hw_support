name: Update STM32 HW support data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Clone hal_stm32
        # Used to classify devicetree-absent peripherals as "not_ported" vs
        # "not_available" (see scripts/scan_hal_stm32.py). hal_stm32's main
        # branch is used for every scanned ref: on-chip IP presence for an
        # already-released series doesn't change retroactively, and new
        # hal_stm32 history only adds series, so this is a deliberate
        # simplification over resolving the exact hal_stm32 revision pinned
        # by each Zephyr ref's west manifest.
        run: |
          git clone --depth 1 --branch main \
            https://github.com/zephyrproject-rtos/hal_stm32 /tmp/hal_stm32

      - name: Scan main
        run: |
          git clone --depth 1 --branch main \
            https://github.com/zephyrproject-rtos/zephyr /tmp/zephyr-main
          python3 scripts/scan_zephyr.py \
            --zephyr-path /tmp/zephyr-main --ref main \
            --hal-stm32-path /tmp/hal_stm32 \
            --mode inplace --output data/main.json

      - name: Discover new stable releases
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          out = subprocess.run(
              ["git", "ls-remote", "--tags", "--refs",
               "https://github.com/zephyrproject-rtos/zephyr"],
              check=True, capture_output=True, text=True,
          ).stdout
          tags = set(re.findall(r"refs/tags/(v\d+\.\d+\.\d+)$", out, re.MULTILINE))
          existing = {p.stem for p in Path("data").glob("v*.json")}
          todo = sorted(tags - existing)
          Path("/tmp/new_releases.json").write_text(json.dumps(todo))
          print("new releases to scan:", todo)
          PY

      - name: Scan new releases
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          todo = json.loads(Path("/tmp/new_releases.json").read_text())
          for ref in todo:
              clone_dir = f"/tmp/zephyr-{ref}"
              subprocess.run(
                  ["git", "clone", "--depth", "1", "--branch", ref,
                   "https://github.com/zephyrproject-rtos/zephyr", clone_dir],
                  check=True,
              )
              subprocess.run(
                  ["python3", "scripts/scan_zephyr.py",
                   "--zephyr-path", clone_dir, "--ref", ref,
                   "--hal-stm32-path", "/tmp/hal_stm32",
                   "--mode", "inplace", "--output", f"data/{ref}.json"],
                  check=True,
              )
          PY

      - name: Rebuild manifest
        run: python3 scripts/build_manifest.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update STM32 HW support snapshot"
          git push
